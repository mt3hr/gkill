name: "gkill CodeQL config"

# セキュリティに加えて品質クエリも実行する
queries:
  - uses: security-and-quality

# 解析対象から外すパス
paths-ignore:
  # ビルド時にのみ実行される補助スクリプト群。
  # 製品バイナリには含まれず、入力も自リポジトリ内のファイルに限られる。
  - src/tools/**

  # マニュアルの生成物（.gitignoreで無視しているが明示しておく）
  - resources/manual/**

  # テストコード。製品バイナリには含まれず、入力も自リポジトリ内に限られる。
  # os.tmpdir() をテストだけが使っているために、テイントを追われた lib 側が
  # js/insecure-temporary-file として報告されるのを避ける。
  # なお paths-ignore が効くのは js-ts のようにビルドせず解析する言語だけで、
  # autobuild の go / manual build の java-kotlin では無視される。
  - "**/__tests__/**"

  # ビルド生成物。いずれも .gitignore 済みで、CI はクリーンチェックアウトなので
  # そもそも存在しない。ローカル実行（npm run codeql）では作業ツリーに残っており、
  # 外さないと生成物由来の指摘が本物を埋めてしまう。
  # 実測: 除外前 2919件 → 除外後 5件（2919件のうち 2812件が Gradle の
  # configuration-cache レポート、81件が Playwright レポート、22件が Vite の
  # minified バンドル。いずれも手で書いたコードではない）。
  - dist/**
  - "**/build/**"
  - playwright-report/**
  - test-results/**

  # embed 配下は dist/ と resources/manual/ のコピー（//go:embed 用）。
  # 追跡しているのは PLACEHOLDER.md だけ。
  - "**/embed/**"
