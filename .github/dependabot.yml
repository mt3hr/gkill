# Dependabotの更新設定。
#
# この設定を置くまではセキュリティ更新しか動いておらず、通常のバージョン更新が
# 止まっていた。依存が古びたまま放置されると新しいadvisoryが出るたびに
# アラートが積み上がるので、定期的に上げる。
#
# PRが洪水にならないよう、npmはminor/patchを1本のPRにまとめ、
# 各エコシステムに同時オープン数の上限を入れている。
version: 2
updates:
  # ルートのpackage.json / package-lock.json。
  # src/mcp配下のサーバもここのnode_modulesから解決するので、npmはこれ1つでよい。
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # minor/patchはまとめて1本にする。majorは個別PRのまま目視で見る
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # Goは本体とプラグインを「1つのPRにまとめて」上げる。
  #
  # src/plugins配下の4モジュールは replace で ../../server を参照しているので、
  # src/server の依存が動くとプラグイン側のgo.modに載っている indirect が古くなり、
  # go mod tidy を打つまで `go: updates to go.mod needed` でビルドが落ちる。
  # 本体だけを対象にすると、立つPRが必ず「Plugins (go test)」ジョブを落とす。
  # directories(複数形) + groups で全モジュールを同じPRに入れて足並みを揃える。
  - package-ecosystem: gomod
    directories:
      - /src/server
      - /src/plugins/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      gomod-all:
        patterns:
          - "*"

  # ワークフローで使うActions。現状すでに全部最新メジャーなのでmonthlyで十分。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
